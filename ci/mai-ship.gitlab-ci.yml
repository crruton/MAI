# MAI Ship для GitLab (ADR 0108): подключается в проект через include.
#
#   include:
#     - remote: https://raw.githubusercontent.com/crruton/MAI/<ref>/ci/mai-ship.gitlab-ci.yml
#
# Переменные проекта или группы (Settings → CI/CD → Variables, protected + masked):
#   GITLAB_TOKEN           токен бот-учётки mai-ship-approver: право апрува, без push
#   SHIP_APPROVER_BASE_URL OpenAI-совместимый шлюз модели approver'а
#   SHIP_APPROVER_API_KEY  ключ шлюза
#   MAI_SHIP_DISABLED      "true" — выключить Ship в проекте
# Настройки и политика — .mai-code/ship.yaml и .mai-code/approval-policy.yaml в target branch.
#
# Сейчас есть роль approver. Ревьюер и steward — следующие шаги (E3.D, E3.E).
# Образа MAI Ship пока нет (E3.A5): джоба берёт MAI из git по закреплённому MAI_SHIP_REF.

variables:
  MAI_SHIP_REPO: https://github.com/crruton/MAI.git
  MAI_SHIP_REF: dev

ship:approval:
  stage: .post
  image: node:24-slim
  rules:
    - if: $MAI_SHIP_DISABLED == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs: []
  interruptible: true
  timeout: 10m
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - git clone --depth 1 --branch "$MAI_SHIP_REF" "$MAI_SHIP_REPO" /tmp/mai
    - cd /tmp/mai && npm ci --omit=dev --ignore-scripts --no-audit --no-fund
  script:
    # --gate: на GitLab Free джоба — гейт «Pipelines must succeed» (ADR 0108). Код 2 — блок,
    # 3 — нужен апрув человека: апрувните MR и перезапустите джобу. В режиме observe — всегда 0.
    # На Premium уберите --gate и включите approval rule для бота.
    - node /tmp/mai/scripts/mai-ship.mjs approve --gate
