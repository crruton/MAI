name: ci

# Разработка идёт в dev, в main — только проверенное (AGENTS.md, правило 9).
# Проверки гоняются на обоих ветках: на dev перед слиянием, на main как
# последний барьер перед релизом по тегу.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm test

      - name: Проверки транспорта Responses API
        run: npm run test:responses

      - name: Проверки экспорта ответов
        run: npm run test:export

      # Агентный цикл и инструменты памяти импортируют electron.app,
      # поэтому идут под Electron в виртуальном дисплее (ADR 0027).
      - name: Агентный цикл и память (Electron)
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          xvfb-run -a npx electron --no-sandbox scripts/test-agent-loop.mjs
          xvfb-run -a npx electron --no-sandbox scripts/test-memory-tools.mjs
          xvfb-run -a npx electron --no-sandbox scripts/test-plugin-host.mjs
          xvfb-run -a npx electron --no-sandbox scripts/test-secrets-electron.mjs
          xvfb-run -a npx electron --no-sandbox scripts/test-ui.mjs

      - name: Ссылки в документации
        run: npm run docs:check

      - name: Пробелы в патчах
        run: git diff --check HEAD

  # Windows — основная платформа приложения. Здесь настоящие cmd.exe, .cmd-обёртки
  # npm, taskkill и DPAPI, которые на Linux проверяются только моделью.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm test

      - name: Проверки только для Windows
        run: node scripts/test-windows.mjs

      - name: Транспорт Responses и экспорт
        run: |
          npm run test:responses
          npm run test:export

      - name: Electron (агентный цикл, память, плагины, ключи, интерфейс, smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($t in 'test-agent-loop', 'test-memory-tools', 'test-plugin-host', 'test-secrets-electron', 'test-ui', 'smoke-electron') {
            Write-Host "== $t"
            npx electron "scripts/$t.mjs"
            if ($LASTEXITCODE -ne 0) { throw "${t}: код $LASTEXITCODE" }
          }
