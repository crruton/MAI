name: ship-image

# Образ MAI Ship (E3.A5, ADR 0126) → ghcr.io/<владелец>/mai-ship. Публикуется только из main;
# в dev и по ручному запуску из других веток — только сборка и проверка без push.
on:
  push:
    branches: [main, dev]
    paths:
      - 'electron/**'
      - 'bin/**'
      - 'scripts/mai-ship.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'ci/ship.Dockerfile*'
      - '.github/workflows/ship-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/ship.Dockerfile
          load: true
          tags: mai-ship:test

      - name: Проверка образа
        run: |
          docker run --rm mai-ship:test mai ship --help
          docker run --rm mai-ship:test node -e "Promise.all(['/opt/mai/electron/lib/agent.js','/opt/mai/electron/lib/ship/steward.js'].map((m) => import(m))).then(() => console.log('ok'))"
          docker run --rm mai-ship:test git --version

      - name: Вход в GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация
        if: github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mai-ship"
          docker tag mai-ship:test "$image:sha-${GITHUB_SHA::12}"
          docker tag mai-ship:test "$image:main"
          docker push "$image:sha-${GITHUB_SHA::12}"
          docker push "$image:main"
